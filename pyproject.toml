[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interviewlens"
version = "0.1.0"
description = "Evidence-grounded AI interview coaching from an uploaded video"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "pyaudio>=0.2.14",
]

[tool.setuptools.packages.find]
where = ["src"]
