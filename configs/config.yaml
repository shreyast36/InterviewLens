demo_mode: true

video:
  fps: 30
  resolution: [1280, 720]
  pose_model: rtmpose-s        # champion; "simplebaseline" = challenger
  window_seconds: 4
  stride_seconds: 1

audio:
  sample_rate: 16000
  channels: 1
  asr_model: whisper-small     # champion; "wav2vec2.0" = challenger

reasoning:
  # Ollama model tag.  Run `ollama pull nemotron-mini` once to download.
  # Requires Ollama to be running locally (`ollama serve`).
  # Falls back to deterministic mock output when the server is unreachable.
  llm_model: nemotron-mini
  max_output_tokens: 1024
  temperature: 0.2
