demo_mode: true

# Single source of truth for which video file notebooks 01/02/03 all analyze. Every
# notebook verifies the file at notebooks/data/<filename> against this checksum before
# running (see notebooks/shared_video.py) -- update sha256 here whenever the video
# changes, or notebooks will fail loudly instead of silently drifting apart.
demo_video:
  filename: test.mp4
  sha256: 295d8e15b5b93628cb7568b56aa4802c1fd76d101d298c40f7a8f01548451a82
  source: >
    User-supplied test.mp4, placed at repo root and copied into notebooks/data/ for this
    run. Swapped in place of demo_kitchen.mp4 per explicit user request.
  duration_s: 24.88

video:
  fps: 30
  resolution: [1280, 720]
  pose_model: rtmpose-s        # champion; "simplebaseline" = challenger
  window_seconds: 4
  stride_seconds: 1

audio:
  sample_rate: 16000
  channels: 1
  asr_model: whisper-small     # champion; "wav2vec2.0" = challenger

reasoning:
  vlm_model: Qwen2.5-VL-3B-Instruct
  max_output_tokens: 1024
  temperature: 0.2
